# Robô semanal: testa todos os links e publica a lista nova.
# A TV baixa tv3/catalog.json pelo GitHub Pages — ninguém precisa reinstalar o app.
name: Lista de canais (semanal)

on:
  schedule:
    - cron: '0 9 * * 1' # toda segunda, 06:00 de Brasília
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: lista-canais
  cancel-in-progress: false

jobs:
  lista:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Montar e testar a lista
        run: node tv3-src/catalog/build-catalog.mjs
      - name: Conferir tamanho mínimo (não publica lista quebrada)
        run: |
          n=$(node -e "console.log(require('./tv3-src/catalog/catalog.json').canais.length)")
          echo "canais: $n"
          test "$n" -ge 800
      - name: Copiar para o site
        run: |
          cp tv3-src/catalog/catalog.json tv3/catalog.json
          node -e "const fs=require('fs');fs.writeFileSync('tv3/catalog.js','window.BUNDLED_CATALOG='+fs.readFileSync('tv3/catalog.json','utf8')+';\n')"
      - name: Publicar
        run: |
          git config user.name "marty-tv-robo"
          git config user.email "actions@users.noreply.github.com"
          git add tv3/catalog.json tv3/catalog.js tv3-src/catalog/catalog.json
          git diff --cached --quiet && echo "nada mudou" && exit 0
          git commit -m "lista de canais: atualização semanal"
          git push
      - name: Pedir ao GitHub Pages para publicar de novo
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
